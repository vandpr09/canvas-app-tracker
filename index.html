<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas App Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="light-mode">

    <!-- TOP BAR -->
    <header class="topbar">
        <h1>Canvas App Tracker</h1>
        <button id="darkModeToggle">Dark Mode</button>
    </header>

    <div class="app-layout">

        <!-- LEFT PANEL -->
        <aside class="left-panel">

            <!-- ADD COURSE -->
            <section class="panel-box">
                <h2>Add Course</h2>
                <input type="text" id="courseName" placeholder="Enter course name">
                <button id="addCourseBtn">Add Course</button>
            </section>

            <!-- ADD TASK -->
            <section class="panel-box">
                <h2>Add Task</h2>

                <label>Course</label>
                <select id="taskCourse">
                    <option value="">Select Course</option>
                </select>

                <label>Title</label>
                <input type="text" id="taskTitle" placeholder="Task title">

                <label>Type</label>
                <select id="taskType">
                    <option value="assignment">Assignment</option>
                    <option value="quiz">Quiz</option>
                    <option value="exam">Exam</option>
                    <option value="syllabus">Syllabus</option>
                </select>

                <label>Due Date</label>
                <input type="date" id="taskDate">

                <label>Time</label>
                <input type="time" id="taskTime">

                <label>Priority</label>
                <select id="taskPriority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>

                <button id="saveTaskBtn">Save Task</button>
            </section>

            <!-- COURSE LIST (EMPTY) -->
            <section class="panel-box">
                <h2>Your Courses</h2>
                <ul id="courseList"></ul>
            </section>

            <!-- SELECTED DAY DETAILS -->
            <section class="panel-box">
                <h2>Selected Day</h2>
                <div id="selectedDate">Click a date</div>
                <div id="taskDetailsList"></div>
            </section>

        </aside>

        <!-- RIGHT PANEL -->
        <main class="right-panel">

            <!-- CALENDAR CONTROLS -->
            <div class="calendar-toolbar">
                <button id="prevMonthBtn">&lt;</button>
                <h2 id="currentMonthYear"></h2>
                <button id="nextMonthBtn">&gt;</button>
            </div>

            <!-- CALENDAR GRID (EMPTY - JS FILLS THIS) -->
            <div class="calendar-grid" id="calendarGrid"></div>

        </main>

    </div>

    <script src="script.js" defer></script>
</body>
</html>
